<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Thema vor dem ersten Bild setzen, damit nichts hell aufblitzt (lib/darstellung.ts)
      try {
        var d = localStorage.getItem('ml-schule.darstellung');
        var dunkel = d === 'dunkel' || (d !== 'hell' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.thema = dunkel ? 'dunkel' : 'hell';
      } catch (e) {}
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ML Schule" />
    <meta name="author" content="Andreas Norren" />
    <link rel="icon" href="/ml-fuer-schueler/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/ml-fuer-schueler/icon.svg" />
    <title>Machine Learning für Schüler</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
